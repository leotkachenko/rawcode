# =============================================================================
# Cloud Build: build the container, push to Artifact Registry, deploy to Cloud Run.
# Invoked by .github/workflows/deploy.yml via `gcloud builds submit`.
#
# Substitutions (all passed in by the workflow; defaults here are for manual
# `gcloud builds submit` runs from a laptop):
#   _REGION         Cloud Run + Artifact Registry location
#   _SERVICE_NAME   Cloud Run service name
#   _AR_REPOSITORY  Artifact Registry Docker repo (must already exist)
#   _SHORT_SHA      commit sha tag ("builds submit" does not populate $SHORT_SHA)
#
# The Cloud Build service account needs: Artifact Registry Writer, Cloud Run
# Admin, and Service Account User on the Cloud Run runtime SA.
#
# No `images:` block on purpose — that pushes only AFTER every step, which would
# be too late for the deploy step below. The push step here runs first instead.
# =============================================================================

substitutions:
  _REGION: us-central1
  _SERVICE_NAME: rawcode-site
  _AR_REPOSITORY: rawcode-site
  _SHORT_SHA: manual

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  # Warm the layer cache. Fails harmlessly on the very first build, when no
  # :latest tag exists yet.
  - id: pull-cache
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        docker pull "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_SERVICE_NAME}:latest" || true

  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - "--tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_SERVICE_NAME}:${_SHORT_SHA}"
      - "--tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_SERVICE_NAME}:latest"
      - "--cache-from=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_SERVICE_NAME}:latest"
      - "."

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - "--all-tags"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_SERVICE_NAME}"

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - "${_SERVICE_NAME}"
      - "--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_SERVICE_NAME}:${_SHORT_SHA}"
      - "--region=${_REGION}"
      - "--platform=managed"
      - "--allow-unauthenticated"
      - "--port=8080"
      - "--min-instances=0"
      - "--max-instances=4"
      - "--memory=512Mi"
      - "--cpu=1"

timeout: 1800s
